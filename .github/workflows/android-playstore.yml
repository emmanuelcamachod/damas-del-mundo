name: Android Play Store Build (Capacitor 6)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-debug-apk:
    name: Verificar Invariantes y Compilar APK Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias Node y sincronizar Capacitor
        run: |
          npm ci
          npm run cap:sync

      - name: Instalar Pillow y ejecutar verificador Play Store
        run: |
          python3 -m pip install --upgrade pillow
          python3 scripts/verify_playstore_ready.py

      - name: Compilar APK Debug con Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir artefacto APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: damas-del-mundo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-release-aab:
    name: Compilar y Firmar App Bundle (.aab) para Google Play
    needs: verify-and-debug-apk
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Validar Secretos de Firma (Espacio Negativo)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Falta secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASS" || { echo "Falta secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Falta secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "Falta secret ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Instalar dependencias Node y sincronizar Capacitor
        run: |
          npm ci
          npm run cap:sync

      - name: Decodificar Keystore y configurar key.properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Compilar Android App Bundle Release (.aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Limpiar credenciales temporales de firma
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties

      - name: Subir artefacto Release .aab
        uses: actions/upload-artifact@v4
        with:
          name: damas-del-mundo-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
