name: 🍏 Universal Flutter iOS Build (iOS 18)

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Nombre de versión (ej. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: Compilar IPA para iPhone (iOS 18)
    runs-on: macos-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔍 Detectar ruta de Flutter
        id: locate-flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          elif [ -f "mobile/pubspec.yaml" ]; then
            echo "path=mobile" >> $GITHUB_OUTPUT
          elif [ -f "app/pubspec.yaml" ]; then
            echo "path=app" >> $GITHUB_OUTPUT
          else
            echo "❌ No se encontró pubspec.yaml" && exit 1
          fi

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Configurar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📱 Generar scaffolding iOS si no existe
        working-directory: ${{ steps.locate-flutter.outputs.path }}
        run: |
          if [ ! -d "ios" ]; then
            echo "Generando plataforma iOS con flutter create..."
            flutter create --platforms=ios --org=com.emmanuelcamacho .
          fi

      - name: 📦 Instalar dependencias
        working-directory: ${{ steps.locate-flutter.outputs.path }}
        run: flutter pub get

      - name: 🔨 Compilar iOS Release (sin firma comercial)
        working-directory: ${{ steps.locate-flutter.outputs.path }}
        run: flutter build ios --release --no-codesign

      - name: 📦 Empaquetar .IPA para iPhone
        working-directory: ${{ steps.locate-flutter.outputs.path }}/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 DamasDelMundo_iOS18.ipa Payload

      - name: 🚀 Entregar IPA listo para instalar
        uses: actions/upload-artifact@v4
        with:
          name: DamasDelMundo-iOS-18-IPA
          path: ${{ steps.locate-flutter.outputs.path }}/build/ios/iphoneos/DamasDelMundo_iOS18.ipa
          retention-days: 14
